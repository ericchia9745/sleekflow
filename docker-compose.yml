# Optional: run MySQL in Docker instead of a local install.
#   docker compose up -d
services:
  mysql:
    image: mysql:9
    container_name: sleekflow-todo-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sleekflow_todo
      MYSQL_USER: todo
      MYSQL_PASSWORD: todo_dev_pw
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ptodo_dev_pw"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  mysql-data:
